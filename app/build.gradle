plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ── 版本号（三通道：稳定 / 测试 / 实验）────────────────────────────────────
// 口径与理由见 docs/version-channels.md §2：
//   versionCode = YYMMDD × 100 + 渠道码 × 10 + 当日序号   （stable=0, beta=1, exp=2）
//   versionName = tag，两者完全相等
//
// 唯一手写项是下面的日期；渠道与序号走 Gradle 参数，不手算：
//   ./gradlew :app:assembleRelease                         → 26.11.14 / 26111400
//   ./gradlew :app:assembleRelease -Pseq=1                 → 26.11.14.1 / 26111401
//   ./gradlew :app:assembleRelease -Pchannel=beta -Pseq=2  → 26.11.14-beta.2 / 26111412
//   ./gradlew :app:assembleRelease -Pchannel=exp  -Pseq=1  → 26.11.14-exp.1 / 26111421
def appVersionDate = "26.11.18"
def appChannel = (project.findProperty('channel') ?: 'stable').toString().trim()
def appChannelCode = [stable: 0, beta: 1, exp: 2][appChannel]
def appSeq = (project.findProperty('seq') ?: (appChannel == 'stable' ? '0' : '1')).toString().trim().toInteger()

if (!(appVersionDate ==~ /\d{2}\.\d{2}\.\d{2}/)) {
    throw new GradleException("appVersionDate 必须是 YY.MM.DD，当前是：${appVersionDate}")
}
if (appChannelCode == null) {
    throw new GradleException("-Pchannel 只能是 stable / beta / exp，收到：${appChannel}")
}
if (appSeq < 0 || appSeq > 9) {
    throw new GradleException("-Pseq 必须是 0~9（同日同渠道最多 10 次），收到：${appSeq}")
}
if (appChannel != 'stable' && appSeq < 1) {
    throw new GradleException("beta / exp 通道的 -Pseq 从 1 开始（0 只留给稳定版）")
}

def appVersionCode = appVersionDate.replaceAll('\\.', '').toInteger() * 100 + appChannelCode * 10 + appSeq
def appVersionName = appVersionDate + (appChannel == 'stable'
        ? (appSeq > 0 ? ".${appSeq}" : "")
        : "-${appChannel}.${appSeq}")

// ── 可选私有功能源码（不入库）──────────────────────────────────────────────
// 私有功能的源码/资源/清单放在仓库根目录的 private/ 下，已被 .gitignore 排除，永不进公开仓库。
// 公共仓库里的挂点只有 util/OptionalFeatures（反射门面）和几处条件注册，不含任何实现。
//   private/src/main/java/...  → 并进主源集
//   private/res/...            → 并进资源
//   private/manifest/…         → 并进合并清单（CAMERA 权限、两个 Activity 都在这里声明）
//   private/keep.pro           → release 的 R8 保留规则（私有类只被反射引用，必须 keep）
// 目录不存在时（公开 CI、PR 构建、其他开发者）以上全部跳过，工程照常编过、功能不存在。
def privateFeatureRoot = project.rootProject.file('private')
def hasPrivateFeature = new File(privateFeatureRoot, 'src/main/java').exists()

android {

    namespace 'com.RobinNotBad.BiliClient'
    compileSdk 34

    sourceSets {
        main{
            jniLibs.srcDirs = ['libs']
            if (hasPrivateFeature) {
                java.srcDirs += new File(privateFeatureRoot, 'src/main/java')
                res.srcDirs += new File(privateFeatureRoot, 'res')
            }
        }
        // 私有功能的纯 JVM 单测跟私有源码一起注入；没有 private/ 时这个目录不存在，
        // 源集为空，公开构建不受影响（对应私有仓库的 private/src/test/java）。
        test {
            if (hasPrivateFeature) {
                java.srcDirs += new File(privateFeatureRoot, 'src/test/java')
            }
        }
    }

    defaultConfig {
        applicationId "com.RobinNotBad.BiliClient"
        minSdk 19
        targetSdk 29
        versionCode appVersionCode
        versionName appVersionName

        multiDexEnabled true

        resConfigs 'zh'

        vectorDrawables {
            useSupportLibrary true
        }

        // ── 私有功能的构建期凭证（不进仓库）──────────────────────────────────
        // 私有侧的 BGM 数据代理需要第三方服务签发的 AppId/AppSecret。和 Kazumi 一样
        // **只在构建期注入**：-PKAZUMI_APPID / -PKAZUMI_KEY，或同名环境变量（CI 从 Secrets 传）。
        // 仓库与源码里永远是空串 → 私有侧自动关闭代理、退回旧链路，公开构建行为不变。
        // 只在有 private/ 时定义这两个字段：没有私有功能的公开构建连这个常量都不会出现。
        if (hasPrivateFeature) {
            // 用 providers 读属性/环境变量：这样 configuration cache 会把「值变了」当作输入变化，
            // 不会出现改了环境变量却复用旧配置、BuildConfig 还是空串的情况。
            def mirrorAppId = providers.gradleProperty('KAZUMI_APPID')
                    .orElse(providers.environmentVariable('KAZUMI_APPID'))
                    .orElse('').get()
                    .toString().replace('\\', '\\\\').replace('"', '\\"')
            def mirrorKey = providers.gradleProperty('KAZUMI_KEY')
                    .orElse(providers.environmentVariable('KAZUMI_KEY'))
                    .orElse('').get()
                    .toString().replace('\\', '\\\\').replace('"', '\\"')
            buildConfigField "String", "BGM_MIRROR_APP_ID", "\"${mirrorAppId}\""
            buildConfigField "String", "BGM_MIRROR_SECRET", "\"${mirrorKey}\""

            // 第三方弹幕（弹弹play）的 AppId / AppSecret：同样是构建期注入，
            // `-PDANDANAPI_APPID / -PDANDANAPI_KEY` 或同名环境变量（CI 从 Secrets 传）。
            // 空串 → 第三方弹幕整体关闭，换源播放退回「没有弹幕」的旧行为。
            def dandanAppId = providers.gradleProperty('DANDANAPI_APPID')
                    .orElse(providers.environmentVariable('DANDANAPI_APPID'))
                    .orElse('').get()
                    .toString().replace('\\', '\\\\').replace('"', '\\"')
            def dandanKey = providers.gradleProperty('DANDANAPI_KEY')
                    .orElse(providers.environmentVariable('DANDANAPI_KEY'))
                    .orElse('').get()
                    .toString().replace('\\', '\\\\').replace('"', '\\"')
            buildConfigField "String", "DANDANAPI_APP_ID", "\"${dandanAppId}\""
            buildConfigField "String", "DANDANAPI_SECRET", "\"${dandanKey}\""
        }
    }

    signingConfigs {
        release {
            def localProps = project.rootProject.file("local.properties")
            if (localProps.exists()) {
                Properties pro = new Properties()
                pro.load(localProps.newDataInputStream())
                if (pro.containsKey("KEY_PATH")) {
                    storeFile project.rootProject.file(pro.getProperty("KEY_PATH", "key.jks"))
                    storePassword pro.getProperty("KEY_PASSWORD")
                    keyAlias pro.getProperty("ALIAS_NAME")
                    keyPassword pro.getProperty("ALIAS_PASSWORD")
                }
            }
        }
    }

    // 两个发行渠道（26.10.11 新增共存版）：
    //   standard —— 包名不变，覆盖升级既有用户；
    //   coexist  —— 包名加 .coexist 后缀，可与普通版**同时安装**（MT 管理器那种共存版）。
    // 两者只有**包名与图标**不同，代码与资源其余部分共用；数据（登录态、设置、缓存、
    // /Android/media/<包名>/）按包名天然隔离，所以共存版要重新登录一次。
    // 名称**刻意保持一致**（两版都叫「RE:哔哩终端」，`app_name` 一个键管应用名与桌面名）——
    // 用户 26.10.11 明确要求，靠图标区分（共存版用上游原图标，见 app/src/coexist/res/mipmap-nodpi/）。
    // 注意：加了 flavor 后单测任务名变成 testStandardDebugUnitTest / testCoexistDebugUnitTest，
    // 老的 testDebugUnitTest 不再存在（CI 与 AGENTS.md 已同步）。见 docs/architecture-map.md §7.37。
    flavorDimensions += 'channel'
    productFlavors {
        standard {
            dimension 'channel'
            buildConfigField "boolean", "COEXIST", "false"
        }
        coexist {
            dimension 'channel'
            applicationIdSuffix ".coexist"
            buildConfigField "boolean", "COEXIST", "true"
        }
    }

    buildTypes {
        release {
            buildConfigField "boolean", "BETA", String.valueOf(appChannel != 'stable')
            buildConfigField "String", "UPDATE_CHANNEL", "\"${appChannel}\""
            buildConfigField "String", "VERSION_NAME_BASE", "\"${appVersionDate}\""
            buildConfigField "boolean", "LOG_DEBUG", "false"
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasPrivateFeature) {
                proguardFile new File(privateFeatureRoot, 'keep.pro')
            }
            def localProps = project.rootProject.file("local.properties")
            if (localProps.exists()) {
                Properties pro = new Properties()
                pro.load(localProps.newDataInputStream())
                if (pro.containsKey("KEY_PATH")) {
                    signingConfig signingConfigs.release
                }
            }

            zipAlignEnabled true
            crunchPngs false
        }
        debug {
            buildConfigField "boolean", "BETA", String.valueOf(appChannel != 'stable')
            buildConfigField "String", "UPDATE_CHANNEL", "\"${appChannel}\""
            buildConfigField "String", "VERSION_NAME_BASE", "\"${appVersionDate}\""
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false

            zipAlignEnabled true
            crunchPngs false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
                '-opt-in=kotlin.RequiresOptIn',
                '-Xinline-classes',
                '-Xjvm-default=all'
        ]
    }

    packagingOptions {
        exclude 'META-INF/androidx.cardview_cardview.version'
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/*.kotlin_module'
            excludes += '/META-INF/*.version'
            excludes += '/kotlin/**'
            excludes += '/DebugProbesKt.bin'
            excludes += '/okhttp3/internal/publicsuffix/*'
            excludes += '/META-INF/maven/**'
            excludes += '/META-INF/proguard/**'
            excludes += '/META-INF/*.kotlin_builtins'
        }
    }

    buildFeatures {
        viewBinding false
        buildConfig true
        compose false
        dataBinding false
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'UnusedResources', 'UnusedIds', 'MissingTranslation', 'ExtraTranslation'
    }

    bundle {
        language {
            enableSplit true
        }
        density {
            enableSplit true
        }
        abi {
            enableSplit true
        }
    }

    // APK 按架构独立打包（仅 assembleRelease 时生效），并额外生成包含所有架构的通用包
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86'
            universalApk true
        }
    }
}

// 私有清单（CAMERA 权限 + 两个 Activity）用 variant 的清单源目录并进合并清单。
// 这是 AGP 8 的标准入口：等价于给每个变体多挂一
